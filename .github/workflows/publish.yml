# ==========================================================================
# paperless-pay – Build & Publish to GHCR
# ==========================================================================
#
# Triggers:
#   - Push auf main   → :latest + :sha-<commit>
#   - Git-Tag v*      → :v1.2.3 + :latest
#
# Multi-Arch: linux/amd64 + linux/arm64
# ==========================================================================

name: Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # owner/paperless-pay

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU für ARM Emulation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Buildx für Multi-Arch
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login bei GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags + Labels automatisch generieren
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Push auf main → :latest + :sha-abc1234
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            # Git-Tag v1.2.3 → :v1.2.3 + :1.2.3 + :1.2
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build + Push (Multi-Arch)
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
