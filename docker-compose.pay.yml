# ==========================================================================
# paperless-pay  (additiv zu deiner paperless-ngx compose)
# ==========================================================================
#
# Dieses Repo als Unterverzeichnis "pay/" in dein
# Paperless-Compose-Verzeichnis klonen, dann starten mit:
#
#   docker compose \
#     -f docker-compose.yml \
#     -f pay/docker-compose.pay.yml \
#     up -d --build pay
#
# Das default-Netzwerk des Paperless-Stacks wird automatisch geteilt.
# ==========================================================================

services:
  pay:
    build:
      context: ./pay
    env_file: pay/.env
    ports:
      - "8081:8080"
    restart: unless-stopped

  pay-link-worker:
    build:
      context: ./pay
      dockerfile: Dockerfile.worker
    env_file: pay/.env
    restart: unless-stopped
