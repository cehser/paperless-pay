# --------------------------------------------------------------------------
# nginx – cookie-passthrough for paperless-pay
# --------------------------------------------------------------------------
# Paperless-ngx + Cookie-Passthrough
# Important: Cookie domain must match (same host/domain for both services)!
#
# Option A: nginx runs INSIDE Docker Compose (same network)
#   → upstream names = Docker service names (paperless, cookie-poc)
# Option B: nginx runs ON THE HOST
#   → 127.0.0.1:8000 / 127.0.0.1:8081 (mapped host ports)

# --- Upstreams (Option A: Docker-internal) --------------------------------
upstream paperless_backend {
    server paperless:8000;          # Docker service
    # server 127.0.0.1:8000;        # Option B: Host
}
upstream cookie_poc_backend {
    server cookie-poc:8080;         # Docker service
    # server 127.0.0.1:8081;        # Option B: Host
}

server {
    listen 443 ssl;
    server_name docs.xy.de;

    # … TLS config here …

    # ------------------------------------------------------------------
    # paperless-pay: /qr-poc/ → FastAPI cookie-passthrough
    # ------------------------------------------------------------------
    location /qr-poc/ {
        proxy_pass         http://cookie_poc_backend/qr-poc/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Forward cookie header as-is (nginx default – explicit here)
        proxy_pass_request_headers on;
    }

    # ------------------------------------------------------------------
    # Paperless-ngx: everything else
    # ------------------------------------------------------------------
    location / {
        proxy_pass         http://paperless_backend/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
