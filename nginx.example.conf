# --------------------------------------------------------------------------
# nginx – cookie-passthrough-check PoC
# --------------------------------------------------------------------------
# Paperless-ngx + Cookie-Passthrough PoC
# Wichtig: Cookie-Domain muss passen (gleicher Host/Domain für beide)!
#
# Variante A: nginx läuft INNERHALB von Docker Compose (gleiche network)
#   → upstream-Namen = Docker-Service-Namen (paperless, cookie-poc)
# Variante B: nginx läuft AUF DEM HOST
#   → 127.0.0.1:8000 / 127.0.0.1:8081 (gemappte Host-Ports)

# --- Upstreams (Variante A: Docker-intern) --------------------------------
upstream paperless_backend {
    server paperless:8000;          # Docker-Service
    # server 127.0.0.1:8000;        # Variante B: Host
}
upstream cookie_poc_backend {
    server cookie-poc:8080;         # Docker-Service
    # server 127.0.0.1:8081;        # Variante B: Host
}

server {
    listen 443 ssl;
    server_name docs.xy.de;

    # … TLS-Config hier …

    # ------------------------------------------------------------------
    # PoC: /qr-poc/ → FastAPI cookie-passthrough-check
    # ------------------------------------------------------------------
    location /qr-poc/ {
        proxy_pass         http://cookie_poc_backend/qr-poc/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cookie-Header 1:1 durchreichen (nginx default – hier explizit)
        proxy_pass_request_headers on;
    }

    # ------------------------------------------------------------------
    # Paperless-ngx: alles andere
    # ------------------------------------------------------------------
    location / {
        proxy_pass         http://paperless_backend/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
